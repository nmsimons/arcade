name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  validate:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Validate and build
    outputs:
      fast: ${{ steps.scope.outputs.fast }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
          fetch-depth: 0 # Compare the entire change against a successful deployment.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Choose deployment checks
        id: scope
        run: node scripts/deploy-scope.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Test deployment selection
        run: node --test tests/deploy-scope.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Check dependency advisories
        run: npm run security:check
      - name: Test gameplay and saves
        if: steps.scope.outputs.fast != 'true'
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          # Production clients are never enabled in arbitrary PR previews.
          VITE_GOOGLE_CLIENT_ID: ${{ github.event_name == 'push' && vars.VITE_GOOGLE_CLIENT_ID || '' }}
          VITE_GOOGLE_PICKER_API_KEY: ${{ github.event_name == 'push' && vars.VITE_GOOGLE_PICKER_API_KEY || '' }}
          VITE_GOOGLE_PROJECT_NUMBER: ${{ github.event_name == 'push' && vars.VITE_GOOGLE_PROJECT_NUMBER || '' }}
          VITE_MICROSOFT_CLIENT_ID: ${{ github.event_name == 'push' && vars.VITE_MICROSOFT_CLIENT_ID || '' }}
      - name: Retain validated build
        uses: actions/upload-artifact@v7
        with:
          name: validated-site
          path: dist/
          retention-days: 1
          if-no-files-found: error

  browser:
    needs: validate
    runs-on: ubuntu-latest
    name: ${{ needs.validate.outputs.fast == 'true' && 'Homepage smoke checks' || format('Browser checks ({0}/3)', matrix.shard) }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.validate.outputs.fast == 'true' && '[1]' || '[1, 2, 3]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: validated-site
          path: dist/
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test homepage layout, navigation and sign-in controls
        if: needs.validate.outputs.fast == 'true'
        run: npm run test:homepage -- --reporter=line
      - name: Test browser routes, recovery and controls
        if: needs.validate.outputs.fast != 'true'
        run: npm run test:browser -- --shard=${{ matrix.shard }}/3 --reporter=line
      - name: Retain browser failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: [validate, browser]
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    name: Deploy validated site
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: validated-site
          path: dist/
      - name: Deploy validated build
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_GLACIER_048815C10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "dist" # Upload the output already validated above.
          api_location: "" # Api source code path - optional
          output_location: ""
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_GLACIER_048815C10 }}
          action: "close"
          app_location: "/"
