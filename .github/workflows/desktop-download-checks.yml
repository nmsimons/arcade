name: Desktop download checks

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing desktop release tag to download and test
        required: true
      build_run:
        description: Successful Desktop builds run for that release tag
        required: true
      windows_sha256:
        description: Windows ZIP hash from the draft release SHA256SUMS.txt
        required: true
      linux_sha256:
        description: Linux archive hash from the draft release SHA256SUMS.txt
        required: true

permissions:
  contents: read
  actions: read

jobs:
  download:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            asset: dream-large-arcade-windows-x64.zip
          - os: ubuntu-22.04
            platform: linux
            asset: dream-large-arcade-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify release source build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          gh run view "$BUILD_RUN" --json conclusion,workflowName,event,headBranch > source-build.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const run = JSON.parse(readFileSync("source-build.json", "utf8"));
            if (run.conclusion !== "success" || run.workflowName !== "Desktop builds" || run.event !== "push" || run.headBranch !== process.env.RELEASE_TAG || !/^desktop-v\d+\.\d+\.\d+$/.test(run.headBranch)) throw new Error("Choose the successful desktop release tag build.");
          '
      - uses: actions/download-artifact@v7
        with:
          name: desktop-downloads-${{ matrix.platform }}-x64
          path: .local/release-check
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - name: Verify archive matches draft download
        shell: bash
        env:
          ARCHIVE: ${{ matrix.asset }}
          EXPECTED_SHA256: ${{ matrix.platform == 'win32' && inputs.windows_sha256 || inputs.linux_sha256 }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            assert.match(process.env.EXPECTED_SHA256, /^[0-9a-f]{64}$/);
            assert.equal(createHash("sha256").update(readFileSync(`.local/release-check/${process.env.ARCHIVE}`)).digest("hex"), process.env.EXPECTED_SHA256);
          '
      - name: Download Windows release
        if: runner.os == 'Windows'
        run: |
          Expand-Archive -LiteralPath .local/release-check/dream-large-arcade-windows-x64.zip -DestinationPath .local/release-check/extracted
          $env:ARCADE_TEST_EXECUTABLE = (Resolve-Path .local/release-check/extracted/dream-large-arcade-desktop-win32-x64/dream-large-arcade.exe).Path
          npm run test:desktop
        env:
          ARCADE_TEST_PACKAGED: '1'
      - name: Install Linux runtime test dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Download Linux release
        if: runner.os == 'Linux'
        run: |
          mkdir -p .local/release-check/extracted
          tar -xzf .local/release-check/dream-large-arcade-linux-x64.tar.gz -C .local/release-check/extracted
          ARCADE_TEST_EXECUTABLE="$PWD/.local/release-check/extracted/dream-large-arcade-desktop-linux-x64/dream-large-arcade" xvfb-run --auto-servernum npm run test:desktop
        env:
          ARCADE_TEST_PACKAGED: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: download-failures-${{ runner.os }}
          path: test-results-desktop/
          if-no-files-found: ignore
