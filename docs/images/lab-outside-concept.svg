<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title description">
  <title id="title">L.A.B. Experiments — Outside</title>
  <desc id="description">Outdoor finale composition study. At left, the familiar gridded service building ends at an open doorway. A worn apron becomes earth and sage plants, a shallow water channel, and a broad rising outcrop. The small robot stands on the safe overlook. Pale sky, long clouds, distant hills, and an abandoned transport span fill the space beyond. The footer identifies the threshold, outdoor journey, and overlook. This is concept art, not a validated playable layout.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#b8cdd2"/>
      <stop offset=".72" stop-color="#e2e4d8"/>
      <stop offset="1" stop-color="#eee9d7"/>
    </linearGradient>
    <pattern id="wall-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#59665d" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <pattern id="earth-grain" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="#b2a18c"/>
      <path d="M14 10h3v2h-3zM54 29h3v2h-3zM35 23h1.5v1.5H35zM73 7h1.5v1.5H73z" fill="#9e8e7a"/>
    </pattern>
    <pattern id="stone-grain" width="80" height="40" patternUnits="userSpaceOnUse">
      <rect width="80" height="40" fill="#999c9e"/>
      <path d="M12 10h8v1.5h-8zM52 30h8v1.5h-8z" fill="#8d9193"/>
    </pattern>
    <clipPath id="scene-clip"><rect width="1600" height="720"/></clipPath>
    <clipPath id="ground-clip">
      <path d="M0 575H407L480 590L555 610L595 643H675L730 625L795 612L875 574L972 549L1045 531H1182L1270 537L1350 551L1450 543L1535 550H1600V720H0Z"/>
    </clipPath>
    <g id="grass" fill="none" stroke="#879579" stroke-width="2.5" stroke-linecap="round">
      <path d="M0 0l-3-9M2 0l5-14M5 0l9-7M-3 0l-8-5"/>
    </g>
    <g id="robot" fill="#686b6e" stroke="#686b6e" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-46" r="6.5" stroke="none"/>
      <path d="M-1-35l2 18M0-29l9 10M0-28l-7 12M1-17l8 15M1-17l-6 15M8-2h6M-5-2h-5" fill="none" stroke-width="4"/>
    </g>
  </defs>

  <rect width="1600" height="930" fill="#f1f1ed"/>
  <g fill="#35423b" font-family="system-ui, sans-serif">
    <text x="48" y="43" font-size="25" font-weight="500">L.A.B. Experiments / Outside</text>
    <text x="1552" y="43" text-anchor="end" font-size="14" letter-spacing="1.5">FINALE COMPOSITION STUDY · OCTOBER 2026</text>
    <text x="48" y="70" font-size="15" fill="#667367">A world with room to breathe.</text>
  </g>

  <g transform="translate(0 94)" clip-path="url(#scene-clip)">
    <rect width="1600" height="720" fill="url(#sky)"/>

    <!-- Broad, spare cloud shapes leave the sky mostly open. -->
    <g fill="#f1f1ed" opacity=".7">
      <path d="M481 157c34-7 74-9 106-5 19-17 56-22 83-13 17 6 29 15 32 24 57-2 93 2 127 11H452Z"/>
      <path d="M1100 94c44-6 89-6 119-2 19-12 49-14 70-7 16 5 26 13 30 19 41-1 80 1 108 10h-378Z" opacity=".72"/>
      <path d="M914 278c33-4 59-3 82 1 17-9 37-11 53-5 10 3 18 7 22 12l79 7H881Z" opacity=".48"/>
    </g>

    <!-- Distant silhouettes have no collision or cast-shadow role. -->
    <path d="M0 482L131 456L208 467L339 429L442 441L521 407L602 420L691 385L745 399L806 376L892 409L962 394L1040 431L1125 410L1218 429L1325 400L1410 415L1507 396L1600 423V720H0Z" fill="#b5c2bc"/>
    <path d="M0 534L165 508L283 524L422 482L522 502L625 460L728 478L847 446L944 476L1058 453L1180 472L1302 445L1384 453L1495 436L1600 456V720H0Z" fill="#a5b4a7"/>

    <!-- One quiet remnant of the old world, below the skyline. -->
    <g fill="#98aaa0">
      <path d="M1238 429h104v5h-104zM1359 432h91v5h-91zM1256 434h7v38h-7zM1304 434h7v31h-7zM1388 437h7v23h-7zM1432 437h7v25h-7z"/>
      <path d="M1316 429v-12h13v12M1404 432v-8h19v8"/>
    </g>
    <path d="M0 570L145 553L248 561L365 526L469 551L567 526L661 548L753 522L823 533L914 510L1014 521L1107 494L1193 503L1277 487L1376 508L1453 492L1523 501L1600 485V720H0Z" fill="#95a89b"/>

    <!-- Authored earth and rock; the open basin has a continuous floor. -->
    <path d="M0 575H407L480 590L555 610L595 643H675L730 625L795 612L875 574L972 549L1045 531H1182L1270 537L1350 551L1450 543L1535 550H1600V720H0Z" fill="url(#earth-grain)"/>
    <g clip-path="url(#ground-clip)">
      <path d="M754 655L823 621L900 596L968 573L1043 559L1173 559L1288 576L1396 583L1494 571L1600 581V720H744Z" fill="url(#stone-grain)"/>
      <path d="M824 674L975 627L1063 618L1178 624L1262 650L1381 654L1490 635L1600 647" fill="none" stroke="#bdc4b5" stroke-width="7" opacity=".65"/>
      <path d="M919 689l113-26 98 5 77 23M1303 700l91-19 117 10" fill="none" stroke="#7f8986" stroke-width="2" opacity=".45"/>
      <path d="M72 648l153-4 90 14M340 694l101-5 76 8" fill="none" stroke="#9e8e7a" stroke-width="2"/>
    </g>
    <path d="M407 575L480 590L555 610M730 625L795 612L875 574L972 549L1045 531H1182L1270 537L1350 551L1450 543L1535 550H1600" fill="none" stroke="#879579" stroke-width="5"/>
    <path d="M795 612L875 574L972 549L1045 531H1182L1270 537" fill="none" stroke="#e1decc" stroke-width="1.5" opacity=".7"/>

    <!-- A small shallow channel, with visible containing banks. -->
    <path d="M565 619H741L730 625L675 643H595Z" fill="#a7bfc0"/>
    <path d="M582 625h80M673 629h39" fill="none" stroke="#d7e1d8" stroke-width="1.5"/>
    <path d="M549 610l19 3 21 30h19M711 637l29-17 17-2" fill="none" stroke="#999c9e" stroke-width="5"/>
    <path d="M558 605l19-4 6 6-4 8-18 1Z" fill="#999c9e"/>
    <path d="M689 611l22-4 14 7-4 9h-29Z" fill="#999c9e"/>

    <!-- Sparse ground cover leaves the actual contact edge visible. -->
    <g>
      <use href="#grass" x="429" y="580"/><use href="#grass" x="451" y="585"/>
      <use href="#grass" x="515" y="602"/><use href="#grass" x="781" y="615"/>
      <use href="#grass" x="846" y="588"/><use href="#grass" x="891" y="570"/>
      <use href="#grass" x="973" y="549"/><use href="#grass" x="1193" y="532"/>
      <use href="#grass" x="1238" y="535"/><use href="#grass" x="1381" y="548"/>
      <use href="#grass" x="1472" y="545"/><use href="#grass" x="1534" y="550"/>
    </g>
    <g fill="#879579">
      <path d="M937 559c-14-3-19-15-13-22 4-4 9-3 12 0 2-12 15-17 22-10 8 7 6 17 0 24Z"/>
      <path d="M1440 544c-12-5-16-13-11-19 5-5 9-2 12 1 2-8 12-11 17-6 7 7 0 15-4 20Z"/>
    </g>

    <!-- The service wall ends here; none of its grid reaches into the sky. -->
    <path d="M0 89H318V473H280V575H0Z" fill="#929b94"/>
    <path d="M0 111H280V575H0Z" fill="#cbd0c5"/>
    <path d="M0 111H280V575H0Z" fill="url(#wall-grid)"/>
    <path d="M0 88H327v23H0ZM280 111h22v362h-22Z" fill="#999c9e"/>
    <path d="M0 575H408v16H0Z" fill="#9aa8b1"/>
    <path d="M0 575H408" stroke="#dce1d9" stroke-width="2"/>
    <path d="M280 473h38v10h-38ZM276 473h5v102h-5Z" fill="#7d8984"/>
    <path d="M16 372h151v4H16M166 374v109h28" fill="none" stroke="#87958b" stroke-width="3"/>
    <rect x="185" y="481" width="18" height="28" rx="1" fill="#9aa8b1"/>
    <path d="M188 489h12m-12 5h12m-12 5h12" stroke="#798c95" stroke-width="1"/>
    <rect x="233" y="503" width="4" height="43" fill="#87958b"/>
    <rect x="229" y="499" width="12" height="5" fill="#758c72"/>
    <text x="26" y="438" font-family="monospace" font-size="12" fill="#657769" letter-spacing="1">EXTERIOR SERVICE</text>
    <path d="M28 451h81m-9-5 9 5-9 5" fill="none" stroke="#657769" stroke-width="1.5"/>

    <!-- Small, familiar silhouette: the world provides the scale. -->
    <use href="#robot" x="1092" y="531"/>
  </g>

  <g font-family="system-ui, sans-serif" fill="#35423b">
    <path d="M48 842h1504" stroke="#c9cec3" stroke-width="1"/>
    <text x="48" y="871" font-size="16" font-weight="500">The threshold</text>
    <text x="48" y="896" font-size="14" fill="#667367">Familiar machinery ends. The horizon opens.</text>
    <text x="590" y="871" font-size="16" font-weight="500">A small outdoor journey</text>
    <text x="590" y="896" font-size="14" fill="#667367">Natural ground, gentle movement, room to linger.</text>
    <text x="1110" y="871" font-size="16" font-weight="500">The overlook</text>
    <text x="1110" y="896" font-size="14" fill="#667367">The robot has left. The world continues.</text>
  </g>
</svg>
